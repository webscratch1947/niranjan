name: prettier

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  prettier:
    name: prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: "18"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Informational only — does not block the build or deployment.
      # The codebase predates this check and hasn't been run through
      # `prettier --write` yet, so this is left non-blocking on purpose.
      - name: Check formatting
        run: npx prettier --check .
        continue-on-error: true
